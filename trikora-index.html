<style>
/* Layout: Atelier – Studio-Bühne links (sticky), Werkbank rechts; am Handy übereinander */
:root{
--bg:#e9ecef;--panel:#f7f8f9;--ink:#15191e;--soft:#5e6773;--line:#d3d8de;--accent:#0b6e4f;--on-accent:#ffffff;
--studio-a:#fbfcfd;--studio-b:#c9ced5;--chip:#ffffff;
--display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--panel:#181c21;--ink:#eef1f4;--soft:#97a0ab;--line:#2a3038;--accent:#35c08f;--on-accent:#04140d;--studio-a:#3a414b;--studio-b:#14171b;--chip:#1f242a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101316;--panel:#181c21;--ink:#eef1f4;--soft:#97a0ab;--line:#2a3038;--accent:#35c08f;--on-accent:#04140d;--studio-a:#3a414b;--studio-b:#14171b;--chip:#1f242a;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:900;font-size:34px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
@media (max-width:520px){.top{flex-wrap:wrap}.acts{justify-content:flex-start;width:100%}.acts .btn{padding:8px 12px;font-size:13px}}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);gap:14px}.brand span{display:none}}
.stagecol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:820px){.stagecol{position:static}}
#stage{position:relative;border-radius:28px;overflow:hidden;background:var(--studio-b);touch-action:pan-y;user-select:none}
#cv{display:block;width:100%;height:auto}
#load{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.tag{position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--panel) 82%,transparent);font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);pointer-events:none}
.views{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.views button{border:0;background:none;border-radius:999px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--soft);cursor:pointer}
.views button.on{background:var(--ink);color:var(--bg)}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:14px 11px 12px;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
#panel{padding:18px;display:flex;flex-direction:column;gap:22px}
.h{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.note{font-size:13px;color:var(--soft);margin:0}
.kits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kit{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600}
.kit.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--chip)}
.rows label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.rows label:first-child{border-top:0}
.rows code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--soft);margin-left:auto}
input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer;flex:none;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.pats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pat{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.pat canvas{width:100%;height:auto;border-radius:11px;display:block}
.pat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.flock{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.field input{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;font-size:17px;width:100%}
.field input.num{font-family:var(--display);font-weight:900;font-size:30px;text-align:center;padding:4px 8px}
.field input:focus{outline:none;border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1.2;text-align:center;min-width:0}
.tile canvas{width:100%;max-width:72px;height:auto;display:block}
.tile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.up{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.up label.btn{cursor:pointer}
.fontrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fontrow button{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:10px;cursor:pointer;font-size:22px;line-height:1.1;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.fontrow button small{font-family:var(--body);font-size:11px;font-weight:600;color:var(--soft);letter-spacing:.06em;text-transform:uppercase}
.fontrow button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sub{border-top:1px solid var(--line);padding-top:18px}
.upbox{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line);border-radius:18px;padding:12px;background:var(--chip)}
.upbox.has{border-style:solid}
.upbox canvas{width:72px;height:72px;border-radius:12px;flex:none;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/14px 14px}
.upbox .ut{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.upbox .ut b{font-size:14px}
.upbox .ut small{color:var(--soft);font-size:12px}
.upbox .row{display:flex;flex-wrap:wrap;gap:6px}
.upbox .btn{padding:7px 12px;font-size:13px}
.pick{position:relative;overflow:hidden;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.pastebox{margin-top:8px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--soft);background:var(--panel);min-height:44px;outline:none;-webkit-user-select:text;user-select:text;overflow:hidden;max-height:90px}
.pastebox:focus{border-color:var(--accent);color:var(--ink)}
.pastebox img{max-height:60px}
.cutgrp{display:flex;flex-direction:column;gap:10px}
.cutgrp .h{margin:0}
.upbox.drag{border-color:var(--accent);background:var(--panel)}
.modes{max-width:1120px;margin:0 auto 14px;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.modes button{border:0;background:none;border-radius:999px;padding:10px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);cursor:pointer}
.modes button.on{background:var(--accent);color:var(--on-accent)}
#gal{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.galhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.galhead h2{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.galhead p{margin:4px 0 0;color:var(--soft);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card img{display:block;width:100%;aspect-ratio:1.5;object-fit:cover;background:var(--studio-b)}
.card .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.card .by{font-size:12px;color:var(--soft)}
.score{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.score b{font-size:18px;color:var(--ink)}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:24px;line-height:1;cursor:pointer;color:var(--line)}
.stars button.on{color:#e0a800}
.stars.ro span{font-size:16px;color:var(--line)}.stars.ro span.on{color:#e0a800}
.card .row2{display:flex;flex-wrap:wrap;gap:6px}
.card .row2 .btn{padding:7px 12px;font-size:13px}
.galnote{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px}
#pad{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
#pad .pt{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto}
#pad .pt b{font-family:var(--display);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.03em}
#padwrap{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:repeating-conic-gradient(var(--line) 0 25%,var(--chip) 0 50%) 0 0/24px 24px;touch-action:none}
#padwrap canvas{position:absolute;inset:0;width:100%;height:100%}
#pad .tools{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#pad .sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#pad .sw2{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
#pad .sw2.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.upbox .btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.squad{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:10px 12px}
.slot .dot{width:30px;height:30px}
.slot div{flex:1;min-width:0}
.slot strong{display:block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.slot small{color:var(--soft);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .btn{padding:7px 12px;font-size:13px}
.slot .btn:disabled{opacity:.35;cursor:default}
#sheet{position:fixed;inset:0;background:rgba(10,12,14,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
#sheet img{max-width:100%;max-height:72vh;border-radius:18px}
#sheet p{color:#e9ecef;margin:0;font-size:14px;text-align:center}
#sheet .btn{background:#ffffff;color:#15191e;border-color:#ffffff}
@media (prefers-reduced-motion:no-preference){#cv{transition:opacity .18s}}
</style>

<header class="top">
<div class="brand"><b>Tri<i>kora</i></b><span>Trikot-Atelier</span></div>
<div class="acts"><button class="btn" id="rnd" type="button">Würfeln</button><button class="btn" id="sv" type="button">Bild speichern</button><button class="btn go" id="online" type="button">Online stellen</button></div>
</header>

<nav class="modes" id="modes" aria-label="Bereich"><button type="button" class="on" data-mode="atelier">Atelier</button><button type="button" data-mode="galerie">Galerie</button></nav>
<section id="gal" hidden aria-label="Galerie"></section>

</section>
<section class="bench" aria-label="Werkbank">

</section>
</main>

<div class="pt"><b id="padT">Selber zeichnen</b><div class="acts"><button type="button" class="btn" id="padX">Abbrechen</button><button type="button" class="btn go" id="padOk">Übernehmen</button></div></div>
<div id="padwrap"><canvas id="padG" width="800" height="800"></canvas><canvas id="padC" width="800" height="800"></canvas></div>
<div class="tools">
<div class="sws" id="padCols"></div>
<div class="seg" id="padTools"></div>
<div class="seg" id="padGuide"></div>
<p class="note">Mit dem Finger oder der Maus malen. Der karierte Grund bleibt durchsichtig. Die gestrichelte Hilfslinie wird nicht übernommen.</p>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

out.sort(function(a,b){return CL.sort==='top'?(b.avg-a.avg)||(b.n-a.n)||(b.at-a.at):(b.at-a.at)});return out}
function starsRO(v){var h='<span class="stars ro" aria-label="'+v.toFixed(1)+' von 5 Sternen">';for(var i=1;i<=5;i++)h+='<span class="'+(v>=i-.25?'on':'')+'">★</span>';return h+'</span>'}
function authBar(){if(!CL.ok)return '';return CL.user?'<div class="seg"><span class="note" style="align-self:center">Angemeldet als '+esc(CL.user.displayName||'Spieler')+'</span><button type="button" data-logout="1">Abmelden</button></div>':'<button type="button" class="btn go" data-login="1">Mit Google anmelden</button>'}
function galRender(){if(MODE!=='galerie')return;var g=$('gal'),h='<div class="galhead"><div><h2>Galerie</h2><p>Trikots aus der Community. Melde dich an, um zu bewerten und eigene Trikots zu zeigen.</p></div><div class="seg"><button type="button" class="'+(CL.sort==='new'?'on':'')+'" data-gsort="new">Neueste</button><button type="button" class="'+(CL.sort==='top'?'on':'')+'" data-gsort="top">Beste</button></div></div>';
h+='<div>'+authBar()+'</div>';
if(!CL.ok){h+='<div class="galnote">Die Galerie konnte nicht starten. Prüfe deine Internetverbindung und lade die Seite neu.</div>'}
else{if(CL.err)h+='<div class="galnote">Die Galerie konnte nicht geladen werden ('+esc(CL.err)+'). Sind die Firestore-Regeln eingetragen?</div>';
var ps=allPosts();
if(!ps.length)h+='<div class="galnote">'+(CL.loaded?'Noch keine Trikots in der Galerie. Gestalte eins im Atelier und tippe oben auf „Online stellen“.':(CL.slow?'Die Galerie antwortet gerade nicht. Prüfe deine Verbindung.':'Galerie wird geladen …'))+'</div>';
else h+='<div class="cards">'+ps.map(function(p){var own=p.uid===CL.uid,by=own?'Von dir':'Von '+esc(p.author||'Spieler');
var rate='';if(!own&&CL.uid){rate='<div class="stars" role="group" aria-label="Bewerten">';for(var i=1;i<=5;i++)rate+='<button type="button" class="'+(p.mine>=i?'on':'')+'" data-rate="'+esc(p.key)+'" data-v="'+i+'" aria-label="'+i+' Sterne">★</button>';rate+='</div>'}
return '<article class="card"><img src="'+p.img+'" alt="Trikot '+esc(p.name)+'" loading="lazy"><div class="cb"><h3>'+esc(p.name)+'</h3><span class="by">'+by+(p.team?' · '+esc(p.team):'')+'</span><div class="score">'+starsRO(p.avg)+'<b>'+(p.n?p.avg.toFixed(1):'–')+'</b>'+(p.n===1?'1 Bewertung':p.n+' Bewertungen')+'</div>'+(rate?'<div class="score">Deine Wertung '+rate+'</div>':(!CL.uid&&!own?'<div class="score"><button type="button" class="btn" data-login="1" style="padding:6px 10px;font-size:12px">Anmelden zum Bewerten</button></div>':''))+'<div class="row2"><button type="button" class="btn" data-copy="'+esc(p.key)+'">Nachbauen</button>'+(own?'<button type="button" class="btn" data-gdel="'+esc(p.key)+'">'+(GDEL===p.key?'Wirklich löschen?':'Löschen')+'</button>':'')+'</div></div></article>'}).join('')+'</div>'}
g.innerHTML=h}
var GDEL=null,VBUSY=false,PUBMSG='';
function myPosts(){return CL.posts.filter(function(p){return p.uid===CL.uid})}
function pubBlock(){initCloud();var h='<div><p class="h" style="font-size:14px;color:var(--ink)">In der Galerie zeigen</p>';
if(!CL.ok)return h+'<p class="note">Die Galerie ist gerade nicht erreichbar.</p></div>';
if(!CL.user)return h+'<p class="note" style="margin-bottom:10px">Melde dich mit Google an, damit dein Trikot deinen Namen trägt und nur du es löschen kannst.</p><button type="button" class="btn go" data-login="1">Mit Google anmelden</button></div>';
subscribe();var mine=myPosts();
if(PUBMSG)h+='<p class="note" style="color:var(--accent);font-weight:600;margin-bottom:8px">'+esc(PUBMSG)+'</p>';
h+='<div style="display:flex;flex-direction:column;gap:10px"><label class="field" for="gname"><span>Name des Trikots</span><input id="gname" maxlength="32" autocomplete="off" placeholder="z. B. FC Seeblick Heim" value=""></label><label class="field" for="gteam"><span>Verein oder Team (optional)</span><input id="gteam" maxlength="32" autocomplete="off" value=""></label><div class="up"><button type="button" class="btn go" data-publish="1"'+(CL.busy?' disabled':'')+'>'+(CL.busy?'Wird veröffentlicht …':'Veröffentlichen')+'</button><button type="button" class="btn" data-mode="galerie">Galerie ansehen</button></div>';
h+='<p class="note">Alle sehen ein Bild deines kompletten Sets und können es bewerten und nachbauen, auch mit deinen eigenen Bildern. Du hast '+mine.length+' von 6 Plätzen belegt. Angemeldet als '+esc(CL.user.displayName||'Spieler')+'.</p></div></div>';return h}
function thumb(){var v0=S.view;S.view='all';var c=mk(10,10);drawView(c,660);S.view=v0;return c.toDataURL('image/jpeg',.8)}
function publish(){if(CL.busy||!ready||!CL.user)return;var nm=($('gname').value||'').trim(),tm=($('gteam').value||'').trim();if(!nm){alertNote('Gib deinem Trikot zuerst einen Namen.');$('gname').focus();return}
if(myPosts().length>=6){alertNote('Du hast schon 6 Trikots in der Galerie. Lösche zuerst eins in der Galerie.');return}
var cp=JSON.parse(JSON.stringify(S));delete cp.tab;delete cp.view;var upl=cp.upl||{};cp.upl={};var ref=FS.collection('kits').doc(),id=ref.id;
var post={uid:CL.uid,author:(CL.user.displayName||'Spieler').slice(0,40),name:nm.slice(0,40),team:tm.slice(0,40),at:Date.now(),img:thumb(),set:cp};
var hasFiles=Object.keys(upl).length>0,files=hasFiles?{uid:CL.uid,upl:upl}:null;if(files&&JSON.stringify(files).length>900000){files=null;hasFiles=false}post.files=hasFiles;
CL.busy=true;panel();(files?FS.collection('kitfiles').doc(id).set(files):Promise.resolve()).then(function(){return ref.set(post)}).then(function(){CL.busy=false;PUBMSG='Veröffentlicht: '+nm+'. Schau in die Galerie!';panel();setTimeout(function(){PUBMSG='';panelIfSave()},6000)},function(e){CL.busy=false;panel();alertNote('Veröffentlichen hat nicht geklappt ('+(e&&e.code||'Fehler')+'). Sind die Firestore-Regeln eingetragen?')})}
function rate(key,v){if(VBUSY||!CL.uid)return;VBUSY=true;var ex=CL.votes.filter(function(x){return!(x.post===key&&x.uid===CL.uid)});ex.push({post:key,uid:CL.uid,v:v});CL.votes=ex;galRender();
FS.collection('votes').doc(key+'_'+CL.uid).set({post:key,uid:CL.uid,v:v}).then(function(){VBUSY=false},function(){VBUSY=false;galNote('Deine Bewertung konnte nicht gespeichert werden.')})}
function galNote(m){var n=document.createElement('div');n.className='galnote';n.textContent=m;$('gal').prepend(n)}
function gdel(key){var p=CL.posts.filter(function(x){return x.key===key})[0];FS.collection('kits').doc(key).delete().then(function(){GDEL=null;if(p&&p.files)FS.collection('kitfiles').doc(key).delete().catch(function(){})},function(){galNote('Löschen hat nicht geklappt.')})}
var MODE='atelier';
function setMode(m){MODE=m;$('atelier').hidden=m!=='atelier';$('gal').hidden=m!=='galerie';document.querySelectorAll('[data-mode]').forEach(function(b){if(b.parentNode.id==='modes')b.classList.toggle('on',b.dataset.mode===m)});
if(m==='galerie'){initCloud();subscribe();galRender();window.scrollTo(0,0)}else show()}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset;
if(d.mode){setMode(d.mode)}
else if(d.login){login()}
else if(d.logout){logout()}
else if(d.gsort){CL.sort=d.gsort;galRender()}
else if(d.rate){rate(d.rate,+d.v)}
else if(d.publish){publish()}
else if(d.copy){var p=allPosts().filter(function(x){return x.key===d.copy})[0];if(p&&p.set){var go=function(upl){var s=JSON.parse(JSON.stringify(p.set));s.upl=upl||{};applySet(s);setMode('atelier');flash('„'+p.name+'“ ist jetzt im Atelier. Ändere es, wie du willst.')};
if(p.files)FS.collection('kitfiles').doc(p.key).get().then(function(ds){go(ds.exists?ds.data().upl:{})},function(){go({})});else go({})}}
else if(d.gdel){if(GDEL===d.gdel)gdel(d.gdel);else{GDEL=d.gdel;galRender()}}});
initCloud();
$('online').onclick=function(){setMode('atelier');S.tab='speichern';ui();setTimeout(function(){var g=$('gname');if(g){g.scrollIntoView({behavior:'smooth',block:'center'});g.focus({preventScroll:true})}},60)};
ui();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
